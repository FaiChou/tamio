# UI tests for the iOS app (mCatussh). They drive the installed app by bundle
# identifier, so install mCatussh on the simulator first; see README.md here.
# Regenerate the project with: xcodegen generate
name: mCatusshUITests
options:
  bundleIdPrefix: me.mizorewww.rayon
  deploymentTarget:
    iOS: "16.0"
targets:
  mCatusshUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
schemes:
  mCatusshUITests:
    build:
      targets:
        mCatusshUITests: [test]
    test:
      targets: [mCatusshUITests]
